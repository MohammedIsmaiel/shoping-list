<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>قائمة التسوق</title>
    <meta name="theme-color" content="#059669">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
        // Apply the saved theme before first paint (no flash)
        (function () {
            try {
                var t = localStorage.getItem('sl.theme');
                var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) { }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Tajawal', 'system-ui', 'Segoe UI', 'Tahoma', 'sans-serif'] } } }
        };
    </script>
    <style type="text/tailwindcss">
        @layer components {
    .btn { @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-bold transition active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/60 disabled:opacity-50; }
    .btn-primary { @apply bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm shadow-emerald-600/20; }
    .btn-ghost { @apply text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800; }
    .btn-outline { @apply border border-slate-300 text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800; }
    .btn-danger { @apply bg-rose-600 text-white hover:bg-rose-700; }
    .icon-btn { @apply inline-flex size-9 shrink-0 items-center justify-center rounded-xl text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/60 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100; }
    .input { @apply w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500; }
    .card { @apply rounded-2xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900; }
  }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal-in { animation: pop .22s ease-out; }
  .fade-in { animation: fade .25s ease-out; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgb(148 163 184 / .4); border-radius: 8px; }
  @media print { header, aside, #toolbar, .no-print { display: none !important; } }
</style>
</head>

<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100">

    <!-- Header -->
    <header
        class="sticky top-0 z-30 h-16 border-b border-slate-200 bg-white/85 backdrop-blur dark:border-slate-800 dark:bg-slate-900/85">
        <div class="mx-auto flex h-full max-w-7xl items-center gap-2 px-3 sm:px-5">
            <button class="icon-btn lg:hidden" data-act="openDrawer" aria-label="القوائم" id="menuBtn"></button>
            <div class="flex items-center gap-2.5">
                <span
                    class="flex size-10 items-center justify-center rounded-2xl bg-emerald-600 text-white shadow-md shadow-emerald-600/30"
                    id="logo"></span>
                <div class="leading-tight">
                    <h1 class="text-base font-extrabold sm:text-lg">قائمة التسوق</h1>
                    <p class="hidden text-xs text-slate-500 dark:text-slate-400 sm:block">نظّم مشترياتك بسهولة</p>
                </div>
            </div>
            <div class="ms-auto flex items-center gap-1">
                <button class="btn btn-ghost !px-3" data-act="import" title="استيراد من ملف JSON"><span
                        data-i="upload"></span><span class="hidden md:inline">استيراد</span></button>
                <button class="btn btn-ghost !px-3" data-act="exportAll" title="تصدير كل القوائم"><span
                        data-i="download"></span><span class="hidden md:inline">تصدير الكل</span></button>
                <button class="icon-btn" data-act="toggleTheme" id="themeBtn" aria-label="تبديل الوضع"></button>
            </div>
        </div>
    </header>

    <div class="mx-auto max-w-7xl lg:flex lg:gap-6 lg:px-5">

        <div id="overlay" class="fixed inset-0 z-30 hidden bg-slate-900/50 backdrop-blur-sm lg:hidden"
            data-act="closeDrawer"></div>

        <!-- Lists sidebar / drawer -->
        <aside id="aside"
            class="fixed inset-y-0 start-0 z-40 flex w-[88%] max-w-sm translate-x-full flex-col gap-4 overflow-y-auto border-e border-slate-200 bg-white p-4 transition-transform duration-300 dark:border-slate-800 dark:bg-slate-900 lg:sticky lg:start-auto lg:top-16 lg:z-0 lg:h-[calc(100vh-4rem)] lg:w-80 lg:max-w-none lg:shrink-0 lg:translate-x-0 lg:self-start lg:border-e-0 lg:bg-transparent lg:px-0 lg:py-5 lg:dark:bg-transparent">
            <div class="flex items-center justify-between lg:hidden">
                <h2 class="text-base font-extrabold">قوائمي</h2>
                <button class="icon-btn" data-act="closeDrawer" aria-label="إغلاق" data-i="x"></button>
            </div>

            <div id="overall" class="grid grid-cols-3 gap-2"></div>

            <button class="btn btn-primary w-full" data-act="newList"><span data-i="plus"></span>قائمة جديدة</button>

            <div class="relative">
                <span class="pointer-events-none absolute inset-y-0 start-3 flex items-center text-slate-400"
                    data-i="search"></span>
                <input id="listSearch" type="search" class="input !ps-10" placeholder="ابحث في القوائم…"
                    autocomplete="off">
            </div>

            <div id="lists" class="flex flex-col gap-2"></div>

            <div class="mt-auto card p-3">
                <div class="mb-1.5 text-xs font-bold text-slate-500 dark:text-slate-400">العملة</div>
                <div id="currencyDd"></div>
                <p class="mt-2 text-[11px] leading-relaxed text-slate-400">تُحفظ البيانات تلقائيًا على جهازك (التخزين
                    المحلي للمتصفح).</p>
            </div>
        </aside>

        <!-- Main -->
        <main class="min-w-0 flex-1 px-3 py-5 sm:px-5 lg:px-0">

            <!-- Empty state -->
            <section id="empty" class="card fade-in hidden flex-col items-center px-6 py-16 text-center">
                <div class="mb-4 flex size-20 items-center justify-center rounded-3xl bg-emerald-100 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-400"
                    id="emptyIcon"></div>
                <h2 class="text-xl font-extrabold">لا توجد قوائم بعد</h2>
                <p class="mt-2 max-w-sm text-sm text-slate-500 dark:text-slate-400">أنشئ قائمة التسوق الأولى، أو استورد
                    قوائمك من ملف JSON.</p>
                <div class="mt-6 flex flex-wrap justify-center gap-2">
                    <button class="btn btn-primary" data-act="newList"><span data-i="plus"></span>قائمة جديدة</button>
                    <button class="btn btn-outline" data-act="import"><span data-i="upload"></span>استيراد</button>
                </div>
            </section>

            <!-- Workspace -->
            <section id="workspace" class="fade-in hidden space-y-4">
                <div id="listHead" class="card p-4 sm:p-5"></div>
                <div id="meta" class="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6"></div>

                <div id="toolbar" class="card space-y-3 p-3 sm:p-4">
                    <form id="quickForm" class="flex gap-2" autocomplete="off">
                        <input id="quickAdd" class="input" placeholder="إضافة سريعة: اكتب اسم العنصر واضغط Enter…"
                            maxlength="200">
                        <button class="btn btn-primary shrink-0" type="submit"><span data-i="plus"></span><span
                                class="hidden sm:inline">إضافة</span></button>
                        <button class="btn btn-outline shrink-0" type="button" data-act="newItem"
                            title="إضافة بتفاصيل كاملة"><span data-i="pencil"></span><span
                                class="hidden sm:inline">تفصيلي</span></button>
                    </form>
                    <div class="flex flex-col gap-3 md:flex-row md:items-center">
                        <div class="relative md:w-64">
                            <span
                                class="pointer-events-none absolute inset-y-0 start-3 flex items-center text-slate-400"
                                data-i="search"></span>
                            <input id="itemSearch" type="search" class="input !ps-10" placeholder="ابحث في العناصر…"
                                autocomplete="off">
                        </div>
                        <div id="sortDd" class="md:w-56"></div>
                        <div id="chips" class="-mx-1 flex gap-2 overflow-x-auto px-1 pb-1 md:ms-auto md:pb-0"></div>
                    </div>
                </div>

                <ul id="items" class="space-y-2.5"></ul>

                <div id="bulk" class="no-print flex flex-wrap gap-2 pt-1"></div>
            </section>
        </main>
    </div>

    <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-[60] flex flex-col items-center gap-2 px-4">
    </div>

    <noscript>
        <p class="p-6 text-center">يحتاج هذا التطبيق إلى تفعيل JavaScript.</p>
    </noscript>

    <script>
        /* ============================== Utilities ============================== */
        const $ = (s, r = document) => r.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const now = () => new Date().toISOString();
        const nf = new Intl.NumberFormat('ar-EG', { maximumFractionDigits: 2 });
        const df = new Intl.DateTimeFormat('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
        const num = n => nf.format(n);
        const money = n => nf.format(n) + ' ' + state.settings.currency;
        const fdate = iso => { try { return df.format(new Date(iso)); } catch { return '—'; } };

        const ICONS = {
            plus: 'M12 4.5v15m7.5-7.5h-15',
            chev: 'M19.5 8.25l-7.5 7.5-7.5-7.5',
            trash: 'M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0',
            pencil: 'M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10',
            download: 'M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3',
            upload: 'M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5',
            sun: 'M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z',
            moon: 'M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z',
            menu: 'M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5',
            x: 'M6 18L18 6M6 6l12 12',
            check: 'M4.5 12.75l6 6 9-13.5',
            copy: 'M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75',
            cart: 'M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z',
            search: 'M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z'
        };
        const icon = (n, cls = 'size-5') => `<svg xmlns="http://www.w3.org/2000/svg" class="${cls}" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="${ICONS[n]}"/></svg>`;

        /* ============================== Domain ============================== */
        const STORE = 'sl.data.v1';
        const CURRENCIES = ['ج.م', 'ر.س', 'د.إ', 'د.ك', 'ر.ق', 'د.أ', '$', '€'];

        const ITEM_STATUS = {
            pending: { label: 'قيد الانتظار', cls: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300' },
            bought: { label: 'تم الشراء', cls: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300' },
            skipped: { label: 'ملغي', cls: 'bg-slate-200 text-slate-700 dark:bg-slate-700/60 dark:text-slate-300' }
        };
        const LIST_STATUS = {
            empty: { label: 'فارغة', cls: 'bg-slate-200 text-slate-700 dark:bg-slate-700/60 dark:text-slate-300', bar: 'bg-slate-400' },
            new: { label: 'جديدة', cls: 'bg-sky-100 text-sky-800 dark:bg-sky-500/15 dark:text-sky-300', bar: 'bg-sky-500' },
            progress: { label: 'قيد التنفيذ', cls: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300', bar: 'bg-amber-500' },
            done: { label: 'مكتملة', cls: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300', bar: 'bg-emerald-500' }
        };

        const validDate = v => { const d = new Date(v); return v && !isNaN(d) ? d.toISOString() : now(); };

        function normItem(i, fresh) {
            i = i && typeof i === 'object' ? i : {};
            const qty = Number(i.qty);
            const created = validDate(i.createdAt);
            return {
                id: fresh || !i.id ? uid() : String(i.id),
                title: String(i.title ?? '').trim().slice(0, 200) || 'بدون عنوان',
                description: String(i.description ?? '').trim().slice(0, 1000),
                price: Math.max(0, Number(i.price) || 0),
                qty: qty > 0 ? qty : 1,
                status: ITEM_STATUS[i.status] ? i.status : 'pending',
                createdAt: created,
                updatedAt: i.updatedAt ? validDate(i.updatedAt) : created
            };
        }
        function normList(l, fresh) {
            l = l && typeof l === 'object' ? l : {};
            const created = validDate(l.createdAt);
            return {
                id: fresh || !l.id ? uid() : String(l.id),
                name: String(l.name ?? '').trim().slice(0, 120) || 'قائمة بدون اسم',
                description: String(l.description ?? '').trim().slice(0, 500),
                createdAt: created,
                updatedAt: l.updatedAt ? validDate(l.updatedAt) : created,
                items: (Array.isArray(l.items) ? l.items : []).map(i => normItem(i, fresh))
            };
        }

        /** The list status is derived from its items' statuses. */
        function listStatus(l) {
            const n = l.items.length;
            if (!n) return 'empty';
            const handled = l.items.filter(i => i.status !== 'pending').length;
            if (!handled) return 'new';
            return handled === n ? 'done' : 'progress';
        }
        function stats(l) {
            const c = { pending: 0, bought: 0, skipped: 0 };
            let total = 0, boughtSum = 0;
            l.items.forEach(i => {
                c[i.status]++;
                if (i.status !== 'skipped') total += i.price * i.qty;
                if (i.status === 'bought') boughtSum += i.price * i.qty;
            });
            const n = l.items.length;
            const base = n - c.skipped;
            return { n, c, total, boughtSum, remaining: total - boughtSum, progress: base > 0 ? Math.round(c.bought / base * 100) : (n ? 100 : 0), status: listStatus(l) };
        }

        function seed() {
            const t = now();
            return {
                lists: [normList({
                    name: 'مشتريات البقالة', description: 'احتياجات الأسبوع من السوبر ماركت', createdAt: t, updatedAt: t,
                    items: [
                        { title: 'خبز بلدي', description: 'رغيف طازج', price: 10, qty: 2, status: 'bought' },
                        { title: 'لبن', description: 'كامل الدسم - ١ لتر', price: 45, qty: 2, status: 'pending' },
                        { title: 'أرز', description: 'عبوة ٢ كجم', price: 80, qty: 1, status: 'pending' },
                        { title: 'زيت زيتون', description: '', price: 220, qty: 1, status: 'skipped' }
                    ]
                }, true)],
                activeId: null,
                settings: { currency: 'ج.م' }
            };
        }
        function load() {
            try {
                const raw = localStorage.getItem(STORE);
                if (raw) {
                    const d = JSON.parse(raw);
                    if (d && Array.isArray(d.lists)) {
                        return {
                            lists: d.lists.map(l => normList(l, false)),
                            activeId: d.activeId || null,
                            settings: { currency: CURRENCIES.includes(d.settings?.currency) ? d.settings.currency : 'ج.م' }
                        };
                    }
                }
            } catch (e) { /* fall through to seed */ }
            return seed();
        }

        let state = load();
        const ui = { listQuery: '', itemQuery: '', filter: 'all', sort: 'created' };
        let warnedStorage = false;

        function save() {
            try { localStorage.setItem(STORE, JSON.stringify(state)); }
            catch (e) { if (!warnedStorage) { warnedStorage = true; toast('تعذّر الحفظ في التخزين المحلي', 'error'); } }
        }
        const active = () => state.lists.find(l => l.id === state.activeId) || null;
        const touch = l => { l.updatedAt = now(); };
        function ensureActive() {
            if (!state.lists.some(l => l.id === state.activeId)) state.activeId = state.lists[0]?.id || null;
        }

        /* ============================== UI helpers ============================== */
        function toast(msg, type = 'ok') {
            const el = document.createElement('div');
            const color = type === 'error' ? 'bg-rose-600' : 'bg-slate-900 dark:bg-slate-100 dark:text-slate-900';
            el.className = `pointer-events-auto modal-in max-w-md rounded-xl px-4 py-2.5 text-sm font-bold text-white shadow-lg ${color}`;
            el.textContent = msg;
            $('#toasts').appendChild(el);
            setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2600);
        }

        let modalEl = null, modalCancel = null;
        function closeModal() {
            closeDd();
            if (!modalEl) return;
            modalEl.remove(); modalEl = null;
            document.body.classList.remove('overflow-hidden');
            const f = modalCancel; modalCancel = null; if (f) f();
        }
        function modal({ title, body, submit = 'حفظ', danger = false, onSubmit, onCancel }) {
            closeModal();
            const el = document.createElement('div');
            el.className = 'fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4';
            el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
            el.innerHTML = `
    <div data-close class="fade-in absolute inset-0 bg-slate-900/55 backdrop-blur-sm"></div>
    <form novalidate class="modal-in relative max-h-[92vh] w-full overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl dark:bg-slate-900 sm:max-w-lg sm:rounded-3xl sm:p-6">
      <div class="mb-4 flex items-center justify-between gap-3">
        <h3 class="text-lg font-extrabold">${title}</h3>
        <button type="button" data-close class="icon-btn" aria-label="إغلاق">${icon('x')}</button>
      </div>
      <div class="space-y-4">${body}</div>
      <div class="mt-6 flex justify-end gap-2">
        <button type="button" data-close class="btn btn-ghost">إلغاء</button>
        <button type="submit" class="btn ${danger ? 'btn-danger' : 'btn-primary'}">${submit}</button>
      </div>
    </form>`;
            el.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
            const form = $('form', el);
            form.addEventListener('submit', e => {
                e.preventDefault();
                form.querySelectorAll('[data-err]').forEach(p => p.classList.add('hidden'));
                if (onSubmit && onSubmit(form) === false) return;
                modalCancel = null; closeModal();
            });
            modalEl = el; modalCancel = onCancel || null;
            document.body.appendChild(el);

            let data;
            try { data = JSON.parse(text); } catch { throw new Error('الملف ليس بصيغة JSON صحيحة'); }
            let lists;
            if (Array.isArray(data)) lists = data;
            else if (data && Array.isArray(data.lists)) lists = data.lists;
            else if (data && Array.isArray(data.items)) lists = [data];
            else throw new Error('بنية الملف غير مدعومة');
            lists = lists.filter(l => l && typeof l === 'object' && Array.isArray(l.items));
            if (!lists.length) throw new Error('لا توجد قوائم صالحة في الملف');
            return lists.map(l => normList(l, true));

                            const lists = parseImport(text);

                    if (file) file.text().then(apply).catch(() => showErr(form, 'file', 'تعذّرت قراءة الملف'));

        function dd({ name = '', value, options, cls = '', act = '', wrapCls = 'inline-block' }) {
            const cur = options.find(o => o[0] === value) || options[0];
            return `<span data-ddwrap class="${wrapCls}">${name ? `<input type="hidden" name="${name}" value="${esc(cur[0])}">` : ''}<button type="button" data-dd data-dd-act="${act}" data-opts="${esc(JSON.stringify(options))}" data-value="${esc(cur[0])}" aria-haspopup="listbox" aria-expanded="false" class="${cls}"><span data-ddlabel class="truncate">${esc(cur[1])}</span>${icon('chev', 'size-4 shrink-0 opacity-70')}</button></span>`;
        }
        let ddMenu = null, ddTrigger = null;
        function closeDd() {
            if (ddMenu) { ddMenu.remove(); ddMenu = null; }
            if (ddTrigger) { ddTrigger.setAttribute('aria-expanded', 'false'); ddTrigger = null; }
        }
        function openDd(btn) {
            if (ddTrigger === btn) return closeDd();
            closeDd();
            const opts = JSON.parse(btn.dataset.opts), val = btn.dataset.value;
            const m = document.createElement('div');
            m.setAttribute('role', 'listbox');
            m.className = 'modal-in fixed z-[80] max-h-64 overflow-y-auto rounded-xl border border-slate-200 bg-white p-1 shadow-xl dark:border-slate-700 dark:bg-slate-900';
            m.innerHTML = opts.map(([v, l]) => `<button type="button" role="option" aria-selected="${v === val}" data-v="${esc(v)}" class="flex w-full items-center justify-between gap-3 rounded-lg px-3 py-2 text-start text-sm transition hover:bg-slate-100 focus:bg-slate-100 focus:outline-none dark:hover:bg-slate-800 dark:focus:bg-slate-800 ${v === val ? 'font-bold text-emerald-600 dark:text-emerald-400' : ''}"><span>${esc(l)}</span>${v === val ? icon('check', 'size-4') : ''}</button>`).join('');
            document.body.appendChild(m);
            const r = btn.getBoundingClientRect();
            m.style.minWidth = Math.max(r.width, 150) + 'px';
            const w = m.offsetWidth, h = m.offsetHeight;
            let top = r.bottom + 6;
            if (top + h > innerHeight - 8 && r.top - h - 6 >= 8) top = r.top - h - 6;   // flip up when there is no room below
            top = Math.max(8, Math.min(top, innerHeight - h - 8));
            const left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8));      // align to the trigger's right edge (RTL)
            m.style.top = top + 'px'; m.style.left = left + 'px';
            btn.setAttribute('aria-expanded', 'true');
            ddMenu = m; ddTrigger = btn;
            (m.querySelector('[aria-selected="true"]') || m.firstElementChild)?.focus({ preventScroll: true });
        }
        function setDdValue(btn, v) {
            const o = JSON.parse(btn.dataset.opts).find(x => x[0] === v);
            if (!o) return;
            btn.dataset.value = v;
            btn.querySelector('[data-ddlabel]').textContent = o[1];
            const h = btn.closest('[data-ddwrap]')?.querySelector('input[type=hidden]');
            if (h) h.value = v;
        }
        function pickDd(v) {
            const btn = ddTrigger; closeDd();
            if (!btn) return;
            const act = btn.dataset.ddAct;
            if (act === 'itemStatus') return requestStatus(btn.closest('[data-id]')?.dataset.id, v);
            setDdValue(btn, v);
            if (act === 'sort') { ui.sort = v; renderItems(); }
            else if (act === 'currency') { state.settings.currency = v; commit(); toast('تم تغيير العملة'); }
        }
        window.addEventListener('scroll', e => { if (ddMenu && !ddMenu.contains(e.target)) closeDd(); }, true);
        window.addEventListener('resize', closeDd);

        /* ---------- Status change from outside the edit form: confirm + adjust price ---------- */
        function requestStatus(id, status) {
            const l = active(), it = getItem(id);
            if (!l || !it || it.status === status) return;
            const from = ITEM_STATUS[it.status], to = ITEM_STATUS[status];
            const form = modal({
                title: 'تأكيد تغيير الحالة',
                submit: 'تأكيد التغيير',
                body: `
      <div class="rounded-xl bg-slate-50 p-3.5 dark:bg-slate-800/60">
        <p class="break-words font-bold">${esc(it.title)}</p>
        <div class="mt-2 flex items-center gap-2 text-sm">${badge(from.cls, from.label)}<span class="text-slate-400">←</span>${badge(to.cls, to.label)}</div>
      </div>
      ${field(`سعر الوحدة (${esc(state.settings.currency)})`, `<input name="price" type="number" inputmode="decimal" min="0" step="0.01" class="input" value="${it.price}">`, 'price', 'عدّل السعر إذا اختلف عن السعر الفعلي.')}
      <div class="flex items-center justify-between rounded-xl border border-slate-200 p-3 text-sm dark:border-slate-700">
        <span class="text-slate-500 dark:text-slate-400">الكمية: ${num(it.qty)}</span>
        <span>الإجمالي: <b data-sub>${money(it.price * it.qty)}</b></span>
      </div>`,
                onSubmit(f) {
                    const raw = f.elements.price.value, price = raw === '' ? 0 : Number(raw);
                    if (isNaN(price) || price < 0) return showErr(f, 'price', 'أدخل سعرًا صحيحًا'), false;
                    it.price = price; it.status = status; it.updatedAt = now(); touch(l);
                    commit(); toast(`تم تغيير الحالة إلى «${to.label}»`);
                }
            });
            form.elements.price.addEventListener('input', () => {
                $('[data-sub]', form).textContent = money((Number(form.elements.price.value) || 0) * it.qty);
            });
        }

        function bulkBought() {
            const l = active(); if (!l) return;
            const pend = l.items.filter(i => i.status === 'pending');
            if (!pend.length) return;
            const form = modal({
                title: 'تأكيد تعليم الكل كمُشترى',
                submit: 'تأكيد الشراء',
                body: `
      <p class="text-sm leading-7 text-slate-500 dark:text-slate-400">سيتم تعليم ${num(pend.length)} عنصر كمُشترى. يمكنك تعديل سعر الوحدة لأي عنصر قبل التأكيد.</p>
      <div class="max-h-72 space-y-2 overflow-y-auto pe-1">
        ${pend.map(i => `
          <div class="flex items-center gap-3 rounded-xl border border-slate-200 p-2.5 dark:border-slate-700">
            <div class="min-w-0 flex-1"><div class="truncate text-sm font-bold">${esc(i.title)}</div><div class="text-xs text-slate-400">الكمية: ${num(i.qty)}</div></div>
            <input name="p_${i.id}" type="number" inputmode="decimal" min="0" step="0.01" class="input !w-28 shrink-0" value="${i.price}" aria-label="سعر ${esc(i.title)}">
          </div>`).join('')}
      </div>
      <div class="flex items-center justify-between rounded-xl bg-slate-50 p-3 text-sm font-bold dark:bg-slate-800/60"><span>إجمالي هذه العناصر</span><span data-sub></span></div>
      <p data-err="price" class="hidden text-sm font-medium text-rose-500"></p>`,
                onSubmit(f) {
                    const vals = pend.map(i => { const raw = f.elements['p_' + i.id].value; return [i, raw === '' ? 0 : Number(raw)]; });
                    if (vals.some(([, p]) => isNaN(p) || p < 0)) return showErr(f, 'price', 'تحقق من الأسعار المُدخلة'), false;
                    vals.forEach(([i, p]) => { i.price = p; i.status = 'bought'; i.updatedAt = now(); });
                    touch(l); commit(); toast('تم تعليم كل العناصر كمُشتراة');
                }
            });
            const upd = () => { $('[data-sub]', form).textContent = money(pend.reduce((a, i) => a + (Number(form.elements['p_' + i.id].value) || 0) * i.qty, 0)); };
            form.addEventListener('input', upd); upd();
        }

        const itemEl = e => e.target.closest('[data-id]');
        const getItem = id => active()?.items.find(i => i.id === id);

        document.addEventListener('click', async e => {
            if (ddMenu) {
                const opt = e.target.closest('[data-v]');
                if (opt && ddMenu.contains(opt)) return pickDd(opt.dataset.v);
                if (!e.target.closest('[data-dd]')) closeDd();
            }
            const trig = e.target.closest('[data-dd]');
            if (trig) return openDd(trig);
            const b = e.target.closest('[data-act]');
            if (!b) return;
            const act = b.dataset.act, l = active();
            switch (act) {
                case 'openDrawer': return openDrawer();
                case 'closeDrawer': return closeDrawer();
                case 'toggleTheme': {
                    const dark = document.documentElement.classList.toggle('dark');
                    try { localStorage.setItem('sl.theme', dark ? 'dark' : 'light'); } catch (_) { }
                    return renderTheme();
                }
                case 'newList': return listForm(null);
                case 'editList': return l && listForm(l);
                case 'selectList': state.activeId = b.dataset.id; save(); closeDrawer(); renderLists(); renderWorkspace(); return window.scrollTo({ top: 0, behavior: 'smooth' });
                case 'dupList': {
                    if (!l) return;
                    const c = normList({ ...l, name: l.name + ' (نسخة)', createdAt: now(), updatedAt: now() }, true);
                    state.lists.unshift(c); state.activeId = c.id; commit(); return toast('تم نسخ القائمة');
                }
                case 'delList': {
                    if (!l) return;
                    if (await confirmDialog(`سيتم حذف القائمة «${esc(l.name)}» وكل عناصرها نهائيًا.`, 'حذف القائمة', 'حذف القائمة')) {
                        state.lists = state.lists.filter(x => x.id !== l.id); state.activeId = null; commit(); toast('تم حذف القائمة');
                    }
                    return;
                }
                case 'exportList': if (l) { download(`${safeName(l.name)}-${dateStamp()}.json`, exportPayload([l])); toast('تم تصدير القائمة'); } return;
                case 'exportAll':
                    if (!state.lists.length) return toast('لا توجد قوائم للتصدير', 'error');
                    download(`shopping-lists-${dateStamp()}.json`, exportPayload(state.lists)); return toast('تم تصدير كل القوائم');
                case 'import': return importDialog();
                case 'newItem': return itemForm(null);
                case 'editItem': return itemForm(getItem(itemEl(e)?.dataset.id));
                case 'toggle': {
                    const it = getItem(itemEl(e)?.dataset.id); if (!it) return;
                    return requestStatus(it.id, it.status === 'bought' ? 'pending' : 'bought');
                }
                case 'delItem': {
                    const it = getItem(itemEl(e)?.dataset.id); if (!it) return;
                    if (await confirmDialog(`حذف العنصر «${esc(it.title)}»؟`, 'حذف')) { l.items = l.items.filter(x => x.id !== it.id); touch(l); commit(); toast('تم حذف العنصر'); }
                    return;
                }
                case 'filter': ui.filter = b.dataset.k; renderChips(); return renderItems();
                case 'markAll': return bulkBought();
                case 'clearBought': {
                    if (await confirmDialog('سيتم حذف كل العناصر التي تم شراؤها من هذه القائمة.', 'حذف المشتريات')) {
                        l.items = l.items.filter(i => i.status !== 'bought'); touch(l); commit(); toast('تم الحذف');
                    }
                    return;
                }
            }
        });

        /* Dropdown selections are handled by the custom dropdown (see pickDd). */

        $('#listSearch').addEventListener('input', e => { ui.listQuery = e.target.value; renderLists(); });
        $('#itemSearch').addEventListener('input', e => { ui.itemQuery = e.target.value; renderItems(); });

        $('#quickForm').addEventListener('submit', e => {
            e.preventDefault();
            const l = active(), inp = $('#quickAdd'), title = inp.value.trim();
            if (!l || !title) return inp.focus();
            const t = now();
            l.items.push({ id: uid(), title: title.slice(0, 200), description: '', price: 0, qty: 1, status: 'pending', createdAt: t, updatedAt: t });
            touch(l); inp.value = ''; commit(); inp.focus();
        });

        document.addEventListener('keydown', e => {
            if (ddMenu) {
                const opts = [...ddMenu.querySelectorAll('[data-v]')], i = opts.indexOf(document.activeElement);
                if (e.key === 'Escape') { const t = ddTrigger; closeDd(); t && t.focus(); e.stopPropagation(); return; }
                if (e.key === 'ArrowDown') { e.preventDefault(); opts[(i + 1) % opts.length].focus(); return; }
                if (e.key === 'ArrowUp') { e.preventDefault(); opts[(i - 1 + opts.length) % opts.length].focus(); return; }
                if (e.key === 'Tab') closeDd();
                return;
            }
            if (e.key === 'Escape') { if (modalEl) closeModal(); else closeDrawer(); }
        });

        /* Keep tabs in sync */
        window.addEventListener('storage', e => { if (e.key === STORE) { state = load(); renderAll(); } });

        /* ============================== Init ============================== */
        (function init() {
            $('#menuBtn').innerHTML = icon('menu');
            $('#logo').innerHTML = icon('cart', 'size-6');
            $('#emptyIcon').innerHTML = icon('cart', 'size-10');
            $('#currencyDd').innerHTML = dd({ value: state.settings.currency, options: CURRENCIES.map(c => [c, c]), act: 'currency', cls: DD_INPUT, wrapCls: 'block' });
            $('#sortDd').innerHTML = dd({ value: ui.sort, options: SORT_OPTS, act: 'sort', cls: DD_INPUT, wrapCls: 'block' });
            renderIcons();
            renderTheme();
            ensureActive();
            save();
            renderAll();
        })();
    </script>
</body>

</html>
